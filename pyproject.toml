[project]
name = "demo-app"
version = "0.1.0"
description = "Terminal chat demo app for the Claude Code training"
authors = [
    { name = "Diego Cattaneo", email = "diego.cattaneo@basedigitale.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=3.42.1",
    "pydantic-settings>=2.16.2",
    "textual>=8.2.8",
]

[project.scripts]
demo-app = "demo_app:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
